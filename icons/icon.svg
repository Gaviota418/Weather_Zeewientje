<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2a3c"/>
      <stop offset="1" stop-color="#0f1622"/>
    </linearGradient>
    <linearGradient id="temp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset=".45" stop-color="#eab308"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="grape" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#b48cf0"/>
      <stop offset="1" stop-color="#5b3a9e"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256) scale(1.2) translate(-254 -280)">
  <!-- raster -->
  <g stroke="#2b3647" stroke-width="3">
    <line x1="64" y1="150" x2="448" y2="150"/>
    <line x1="64" y1="250" x2="448" y2="250"/>
    <line x1="64" y1="350" x2="448" y2="350"/>
  </g>
  <!-- regenbalken -->
  <g fill="#4a72b8">
    <rect x="300" y="404" width="22" height="40" rx="3"/>
    <rect x="332" y="380" width="22" height="64" rx="3"/>
    <rect x="364" y="396" width="22" height="48" rx="3"/>
    <rect x="396" y="418" width="22" height="26" rx="3"/>
  </g>
  <!-- temperatuurlijn: gemeten (vol) en verwachting (gestippeld) -->
  <path d="M64 300 C 110 300, 130 200, 180 190 S 250 120, 290 130" fill="none" stroke="url(#temp)" stroke-width="16" stroke-linecap="round"/>
  <path d="M290 130 C 330 140, 360 210, 400 200 S 440 170, 452 165" fill="none" stroke="#f97316" stroke-width="12" stroke-linecap="round" stroke-dasharray="2 24"/>
  <circle cx="290" cy="130" r="14" fill="#f97316" stroke="#0f1622" stroke-width="6"/>
  <!-- druiventros -->
  <g transform="translate(212 338)">
    <path d="M0 -62 C 4 -82, 20 -96, 40 -104" fill="none" stroke="#8cc47c" stroke-width="8" stroke-linecap="round"/>
    <path d="M14 -80 C 40 -112, 92 -104, 98 -70 C 70 -64, 38 -60, 14 -80 Z" fill="#8cc47c"/>
    <g fill="url(#grape)" stroke="#0f1622" stroke-width="4">
      <circle cx="-38" cy="-36" r="24"/>
      <circle cx="0" cy="-40" r="24"/>
      <circle cx="38" cy="-36" r="24"/>
      <circle cx="-20" cy="2" r="24"/>
      <circle cx="20" cy="2" r="24"/>
      <circle cx="0" cy="40" r="24"/>
    </g>
  </g>
  </g>
</svg>
